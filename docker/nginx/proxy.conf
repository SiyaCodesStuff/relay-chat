proxy_pass http://relay_api;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
# Overwrite, never append caller-supplied forwarding chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Origin "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 75s;
proxy_send_timeout 30s;
proxy_buffering off;
proxy_cache off;
# Never retry mutations after a partially completed upstream request.
proxy_next_upstream off;
# The ingress owns the browser-facing policy; do not send conflicting duplicates.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
