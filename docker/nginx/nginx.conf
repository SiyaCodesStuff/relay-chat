worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 65s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Docker's embedded DNS refreshes replica addresses after a replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream relay_api {
        zone relay_api 64k;
        server api-1:3000 resolve;
        server api-2:3000 resolve;
        keepalive 16;
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        # Local HTTP deliberately has no Strict-Transport-Security header.
        location = /nginx-health {
            default_type text/plain;
            return 200 'ok\n';
        }
        location = /healthz { include /etc/nginx/proxy.conf; }
        location = /readyz { include /etc/nginx/proxy.conf; }
        location = /api { include /etc/nginx/proxy.conf; }
        location ^~ /api/ { include /etc/nginx/proxy.conf; }
        location ^~ /socket.io { include /etc/nginx/proxy.conf; }
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"error":"INPUT_TOO_LARGE"}';
        }
    }
}
